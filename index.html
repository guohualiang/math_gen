<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中小学数学计算题生成器 - 增强版</title>
    <meta name="description" content="专业的中小学数学练习题生成器，支持1-8年级全部题型，包含计时、评分等互动功能">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- App Header -->
    <header class="app-header">
        <h1 data-i18n="appTitle">📐 中小学数学计算题生成器</h1>
        <p data-i18n="appSubtitle">支持1-8年级 | 多种题型 | 智能评分 | 个性化练习</p>

        <!-- Profile Controls in Header -->
        <div class="header-profile">
            <select id="profileSelector" onchange="selectProfile(this.value)">
                <option value="" data-i18n="selectUser">选择用户...</option>
            </select>
            <span id="currentProfileName" class="profile-display" data-i18n="noUserSelected">未选择用户</span>
            <button class="btn-header" onclick="showProfileModal()" title="用户管理"><span data-i18n="userBtn">👤
                    用户</span></button>
            <button class="btn-header" onclick="showHistoryModal()" title="练习记录"><span data-i18n="historyBtn">📊
                    历史</span></button>
            <button class="btn-header" onclick="toggleLanguage()" title="Language"><span id="langBtnText">🌐
                    English</span></button>
        </div>
    </header>

    <!-- Controls Panel -->
    <div class="controls">
        <!-- Grade Selection -->
        <div class="control-group">
            <label data-i18n="gradeLabel">年级</label>
            <select id="gradeSelect" onchange="updateTypes()">
                <option value="1" data-i18n="grade1">一年级</option>
                <option value="2" data-i18n="grade2">二年级</option>
                <option value="3" data-i18n="grade3">三年级</option>
                <option value="4" data-i18n="grade4">四年级</option>
                <option value="5" data-i18n="grade5">五年级</option>
                <option value="6" data-i18n="grade6">六年级</option>
                <option value="7" data-i18n="grade7">七年级</option>
                <option value="8" data-i18n="grade8">八年级</option>
            </select>
        </div>

        <!-- Type Selection -->
        <div class="control-group">
            <label data-i18n="typeLabel">题型</label>
            <select id="typeSelect"></select>
        </div>

        <!-- Difficulty Selection -->
        <div class="control-group">
            <label data-i18n="diffLabel">难度</label>
            <select id="diffSelect">
                <option value="1" data-i18n="diff1">入门</option>
                <option value="2" selected data-i18n="diff2">基础</option>
                <option value="3" data-i18n="diff3">进阶</option>
                <option value="4" data-i18n="diff4">挑战</option>
            </select>
        </div>

        <!-- Question Count -->
        <div class="control-group">
            <label data-i18n="countLabel">题量</label>
            <select id="countSelect">
                <option value="10" data-i18n="count10">10题</option>
                <option value="20" selected data-i18n="count20">20题</option>
                <option value="30" data-i18n="count30">30题</option>
                <option value="40" data-i18n="count40">40题</option>
            </select>
        </div>

        <!-- Action Buttons -->
        <button class="btn-primary" onclick="generateSheet()">
            <span data-i18n="generateBtn">🎲 生成试卷</span>
        </button>

        <button class="btn-secondary" onclick="window.print()">
            <span data-i18n="printBtn">🖨️ 打印</span>
        </button>

        <!-- Theme Toggle -->
        <button id="themeToggle" class="btn-icon" onclick="toggleTheme()" title="切换主题" data-i18n-title="themeToggle">
            🌙
        </button>
    </div>

    <!-- Secondary Controls -->
    <div class="controls">
        <!-- Interactive Mode Toggle -->
        <div class="toggle-group">
            <span data-i18n="interactiveMode">互动模式</span>
            <div id="interactiveToggle" class="toggle" onclick="toggleInteractiveMode()"></div>
        </div>

        <!-- Show Answers Toggle -->
        <div class="toggle-group">
            <span data-i18n="showAnswers">显示答案</span>
            <div id="answerToggle" class="toggle" onclick="toggleAnswers()"></div>
        </div>

        <!-- Timer Toggle -->
        <button class="btn-warning" onclick="toggleTimer()">
            <span data-i18n="timerBtn">⏱️ 计时器</span>
        </button>

        <!-- Save/Load -->
        <button class="btn-success" onclick="saveWorksheet()">
            <span data-i18n="saveBtn">💾 保存</span>
        </button>

        <label class="btn-secondary" style="cursor: pointer;">
            <span data-i18n="loadBtn">📂 加载</span>
            <input type="file" accept=".json" onchange="loadWorksheet(event)" style="display: none;">
        </label>

        <!-- Submit Results -->
        <button class="btn-primary" onclick="submitWorksheet()">
            <span data-i18n="submitBtn">✅ 提交成绩</span>
        </button>
    </div>

    <!-- Timer Container -->
    <div class="controls">
        <div id="timerContainer" class="timer-container">
            <label data-i18n="timerMinutesLabel">时长(分钟):</label>
            <input type="number" id="timerMinutes" value="10" min="1" max="60" style="width: 60px;">
            <span id="timerDisplay" class="timer-display">10:00</span>
            <button class="btn-success" onclick="startTimer()" data-i18n="timerStart">开始</button>
            <button class="btn-warning" onclick="stopTimer()" data-i18n="timerPause">暂停</button>
            <button class="btn-secondary" onclick="resetTimer()" data-i18n="timerReset">重置</button>
        </div>
    </div>

    <!-- Stats Panel -->
    <div id="statsPanel" class="stats-panel">
        <div class="stats-grid">
            <div class="stat-card">
                <div id="correctCount" class="stat-value" style="color: var(--success-color);">0</div>
                <div class="stat-label" data-i18n="statCorrect">正确</div>
            </div>
            <div class="stat-card">
                <div id="incorrectCount" class="stat-value" style="color: var(--error-color);">0</div>
                <div class="stat-label" data-i18n="statIncorrect">错误</div>
            </div>
            <div class="stat-card">
                <div id="totalCount" class="stat-value">0</div>
                <div class="stat-label" data-i18n="statAnswered">已答</div>
            </div>
            <div class="stat-card">
                <div id="accuracyRate" class="stat-value">0%</div>
                <div class="stat-label" data-i18n="statAccuracy">正确率</div>
            </div>
        </div>
    </div>

    <!-- Worksheet Sheet -->
    <div class="sheet">
        <div class="sheet-header">
            <h2 id="sheetTitle" data-i18n="sheetTitle">数学计算练习</h2>
            <div class="sheet-info">
                <span data-i18n="classAndName">班级：__________ 姓名：__________</span>
                <span data-i18n="scoreLabel">得分：__________</span>
            </div>
        </div>
        <div class="questions-grid" id="qContainer"></div>
    </div>

    <!-- Load JavaScript -->
    <script src="app.js"></script>

</body>

</html>
